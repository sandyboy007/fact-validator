name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Python API — install deps, lint, run smoke tests
  # ────────────────────────────────────────────────────────────────────────────
  api-test:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.0"
          cache: pip
          cache-dependency-path: services/api/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Lint with Ruff (non-blocking)
        run: |
          pip install ruff
          ruff check app/ --exit-zero

      - name: Run smoke tests
        env:
          # Prevent any accidental real HTTP calls during tests
          SERPAPI_API_KEY: ""
          OLLAMA_BASE_URL: "http://127.0.0.1:11434"
        run: pytest tests/ -v --tb=short

  thesis-artifacts:
    name: Thesis artifact validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.0"
          cache: pip
          cache-dependency-path: services/api/requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r services/api/requirements.lock

      - name: Regenerate statistical artifacts
        run: python services/api/Scripts/run_thesis_statistics.py

      - name: Validate split, predictions, manifest, and reports
        run: python services/api/Scripts/validate_thesis_artifacts.py

      - name: Require committed reports to match regeneration
        run: |
          git diff --exit-code -- \
            data/benchmarks/results_5000/statistics_report.json \
            data/benchmarks/results_5000/confusion_matrix_full_proxy.csv \
            data/benchmarks/results_5000/per_class_metrics.csv \
            data/benchmarks/results_5000/per_dataset_metrics.csv \
            data/benchmarks/results_5000/paired_tests.csv \
            data/benchmarks/results_5000/statistics_summary.md

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Next.js frontend — install, lint, type-check, production build
  # ────────────────────────────────────────────────────────────────────────────
  web-build:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
